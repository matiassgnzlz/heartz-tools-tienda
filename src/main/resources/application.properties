server.port=8082
spring.datasource.url=${TIENDA_DB_URL:jdbc:mysql://localhost:3306/heartz_tienda?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TIENDA_DB_USER:root}
spring.datasource.password=${TIENDA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=heartz-tools-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}